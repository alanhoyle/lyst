[package]
name = "lyst"
version = "0.1.0"
edition = "2024"
description = "A modern take on Vernon Buerg's LIST file viewer"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.10", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
infer = { version = "0.22.0", default-features = false }
memchr = "2.8.3"
memmap2 = "0.9.12"
regex = "1.13.2"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "plist-load", "regex-fancy", "yaml-load"] }
tar = { version = "0.4.46", default-features = false }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.3"
zip = { version = "=9.5.1", default-features = false }

# Only used to signal a preprocessor's process group on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true
